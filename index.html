<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>هدف</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="هدف">
<meta name="application-name" content="هدف">
<meta name="description" content="برنامه‌ریزی اهداف روزانه، ماهانه و بلندمدت">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root, html[data-theme="light"] {
  --card: #ffffff;
  --tx: #1e1b4b;
  --mu: #6b7280;
  --soft: #f5f3ff;
  --ac: #0d9488;
  --ac2: #7c3aed;
  --ok: #16a34a;
  --dg: #ef4444;
  --bg1: #ccfbf1;
  --bg2: #ede9fe;
  --bg3: #fae8ff;
  --nav-bg: rgba(255,255,255,0.85);
  --live-bg: rgba(255,255,255,0.85);
  --live-bd: #ffffff;
  --sh-grad: linear-gradient(90deg, #ccfbf1, #ede9fe);
  --shadow: rgba(124,58,237,0.09);
  --shadow2: rgba(124,58,237,0.12);
  --ck-bd: #c4b5fd;
  --modal-bg: rgba(30,27,75,0.55);
}
html[data-theme="dark"] {
  --card: #1a1625;
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --soft: #2a2438;
  --ac: #2dd4bf;
  --ac2: #a78bfa;
  --ok: #4ade80;
  --dg: #f87171;
  --bg1: #0c0a12;
  --bg2: #15101f;
  --bg3: #1a1225;
  --nav-bg: rgba(42,36,56,0.9);
  --live-bg: rgba(42,36,56,0.9);
  --live-bd: #3f3a55;
  --sh-grad: linear-gradient(90deg, #134e4a, #4c1d95);
  --shadow: rgba(0,0,0,0.45);
  --shadow2: rgba(0,0,0,0.5);
  --ck-bd: #6d28d9;
  --modal-bg: rgba(0,0,0,0.7);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;
  min-height:100vh;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%) fixed;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background 0.25s ease,color 0.25s ease;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
.wrap{max-width:680px;margin:0 auto;padding:14px 12px 28px}
.hd{text-align:center;position:relative}
.theme-bar{position:absolute;top:0;left:0;display:flex;gap:6px;align-items:center;z-index:5}
.theme-btn{
  width:36px;height:36px;border-radius:50%;border:2px solid transparent;
  background:var(--soft);color:var(--tx);cursor:pointer;font-size:17px;
  display:grid;place-items:center;box-shadow:0 2px 8px var(--shadow2);
  transition:0.2s;padding:0;line-height:1;
}
.theme-btn:active{transform:scale(0.9)}
.theme-btn.active{
  border-color:var(--ac2);
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#fff;
  box-shadow:0 4px 14px rgba(124,58,237,0.4);
}
h1{margin:0;font-size:34px;font-weight:800;line-height:1.3}
h1 b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{
  display:inline-flex;align-items:center;gap:8px;background:var(--live-bg);
  border:1px solid var(--live-bd);padding:8px 16px;border-radius:99px;font-size:14px;
  margin:6px 0 16px;box-shadow:0 4px 16px var(--shadow2);
}
.live b{color:var(--ac2);font-variant-numeric:tabular-nums;direction:ltr}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;animation:pl 1.4s infinite;flex:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.8)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
nav button{
  border:0;border-radius:18px;padding:12px 4px;background:var(--nav-bg);color:var(--tx);
  font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:6px;font-size:13px;box-shadow:0 4px 14px var(--shadow2);transition:0.2s;
}
nav button span{font-size:20px;width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 20px rgba(124,58,237,0.35)}
nav button.on span{background:rgba(255,255,255,0.2)}
.card{background:var(--card);border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 8px 28px var(--shadow);transition:background 0.25s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  border:0;border-radius:14px;height:46px;padding:0 14px;
  background:linear-gradient(135deg,var(--ac),#14b8a6);color:#fff;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;white-space:nowrap;
}
.btn.alt{background:linear-gradient(135deg,var(--ac2),#a855f7)}
.btn.ghost{background:var(--soft);color:var(--tx)}
.dn{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center;text-align:center;font-weight:700}
.dn .btn{padding:0;font-size:20px}
.add{display:flex;flex-wrap:wrap;gap:8px}
.add input{flex:1 1 100%}
.add.one input{flex:1 1 150px}
.add select{flex:1 1 0}
input,select,textarea{
  background:var(--soft);border:1.5px solid transparent;border-radius:14px;
  padding:0 14px;height:46px;min-width:0;width:100%;outline:0;color:var(--tx);
}
input:focus,select:focus,textarea:focus{border-color:var(--ac2);background:var(--card)}
input[type="time"]{
  direction:ltr;text-align:center;padding:0 6px;width:118px;height:40px;flex:0 0 auto;
  font-weight:600;background:var(--card);color:var(--tx);min-width:0;
}
.pg{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:14px 0 6px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width 0.3s}
.st{color:var(--mu);font-size:13px}
.sec{margin-top:16px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sh-grad);border-radius:14px;padding:8px 12px;font-weight:700}
.sh small{direction:ltr;background:rgba(255,255,255,0.7);border-radius:99px;padding:2px 10px;color:var(--ac2);font-weight:600;white-space:nowrap}
html[data-theme="dark"] .sh small{background:rgba(255,255,255,0.12)}
.it{display:flex;align-items:center;gap:10px;padding:10px;background:var(--soft);border-radius:16px;margin-top:8px}
.n{width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--ac2);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.ck{width:28px;height:28px;border-radius:10px;border:2px solid var(--ck-bd);background:var(--card);color:transparent;cursor:pointer;flex:none;font-size:15px;display:grid;place-items:center;padding:0}
.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.tx{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.7}
.done .tx{text-decoration:line-through;color:var(--mu)}
.ic{width:34px;height:34px;border:0;border-radius:11px;background:var(--card);cursor:pointer;font-size:15px;display:grid;place-items:center;padding:0;flex:none;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:22px 0}
.mo{position:fixed;inset:0;background:var(--modal-bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:24px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;color:var(--tx)}
.md h3{margin:0 0 12px;text-align:center}
.md label{display:block;margin:8px 0 4px;color:var(--mu);font-size:13px}
.md textarea{height:260px;padding:12px;line-height:1.9;resize:none;border-radius:14px}
.md img{width:100%;border-radius:14px;display:block}
.mb{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.sr{background:var(--soft);border-radius:16px;padding:10px;margin-top:8px}
.r1{display:flex;gap:8px;align-items:center}
.r1 input{height:40px;text-align:center;font-weight:600;background:var(--card)}
.r2{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--mu);font-size:13px;flex-wrap:nowrap;direction:rtl}
.addb{width:100%;margin-top:10px;height:44px;border:1.5px dashed var(--ck-bd);background:none;border-radius:14px;color:var(--ac2);cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header class="hd">
 <div class="theme-bar">
   <button type="button" class="theme-btn" id="btnLight" title="تم روشن" aria-label="تم روشن">☀️</button>
   <button type="button" class="theme-btn" id="btnDark" title="تم تاریک" aria-label="تم تاریک">🌙</button>
 </div>
 <h1><b>هدف</b> 🎯</h1>
 <div class="live"><i class="dot"></i><span id="dt"></span><span>•</span><b id="clk"></b></div>
 <nav id="nav"></nav>
</header>
<main id="main"></main>
</div>
<div id="mo"></div>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var FA = function (s) { return String(s).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };
  var P2 = function (n) { return String(n).padStart(2, '0'); };
  var MN = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  function def() { return { sec: [], d: {}, m: {}, l: [], y: [], ds: '' }; }
  var S;
  try {
    var raw = localStorage.getItem('hadaf');
    var parsed = raw ? JSON.parse(raw) : {};
    S = Object.assign(def(), parsed);
    if (!Array.isArray(S.sec)) S.sec = [];
    if (!S.d || typeof S.d !== 'object') S.d = {};
    if (!S.m || typeof S.m !== 'object') S.m = {};
    if (!Array.isArray(S.l)) S.l = [];
    if (!Array.isArray(S.y)) S.y = [];
  } catch (e) { S = def(); }
  function save() { try { localStorage.setItem('hadaf', JSON.stringify(S)); } catch (e) {} }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  var uid = function () { return Math.random().toString(36).slice(2, 9); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  function jp(dt) {
    var o = {};
    try {
      new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' })
        .formatToParts(dt).forEach(function (p) { o[p.type] = p.value; });
    } catch (e) { o.year = dt.getFullYear(); o.month = dt.getMonth() + 1; o.day = dt.getDate(); }
    return { y: +o.year, m: +o.month, d: +o.day };
  }
  var wd = function (dt) {
    try { return dt.toLocaleDateString('fa-IR', { weekday: 'long' }); }
    catch (e) { return ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][dt.getDay()]; }
  };
  var jstr = function (dt) {
    var j = jp(dt);
    return FA(j.d) + ' ' + MN[Math.max(0, Math.min(11, j.m - 1))] + ' ' + FA(j.y);
  };
  var iso = function (dt) { return dt.getFullYear() + '-' + P2(dt.getMonth() + 1) + '-' + P2(dt.getDate()); };
  var tab = 'd', off = 0, lastImg = '';
  var now0 = jp(new Date());
  var my = now0.y, mm = now0.m;

  function getTheme() {
    try { return localStorage.getItem('hadaf-theme') === 'dark' ? 'dark' : 'light'; }
    catch (e) { return 'light'; }
  }
  function applyTheme() {
    var theme = getTheme();
    document.documentElement.setAttribute('data-theme', theme);
    var bl = document.getElementById('btnLight');
    var bd = document.getElementById('btnDark');
    if (bl) bl.classList.toggle('active', theme === 'light');
    if (bd) bd.classList.toggle('active', theme === 'dark');
    var meta = document.getElementById('metaTheme');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c0a12' : '#7c3aed');
  }
  function setTheme(mode) {
    try { localStorage.setItem('hadaf-theme', mode); } catch (e) {}
    applyTheme();
  }
  function bindTheme() {
    var bl = document.getElementById('btnLight');
    var bd = document.getElementById('btnDark');
    if (bl) bl.onclick = function (e) { e.preventDefault(); e.stopPropagation(); setTheme('light'); };
    if (bd) bd.onclick = function (e) { e.preventDefault(); e.stopPropagation(); setTheme('dark'); };
    applyTheme();
  }
  bindTheme();

  function tick() {
    try {
      var n = new Date();
      var clk = $('#clk'), dt = $('#dt');
      if (clk) clk.textContent = FA(P2(n.getHours()) + ':' + P2(n.getMinutes()) + ':' + P2(n.getSeconds()));
      if (dt) dt.textContent = wd(n) + '، ' + jstr(n);
    } catch (e) {}
  }
  setInterval(tick, 1000);
  tick();

  var TABS = [['d','📅','اهداف روزانه'],['m','🗓️','اهداف ماهانه'],['l','🚀','اهداف بلندمدت']];
  function curDay() { var x = new Date(); x.setDate(x.getDate() + off); return x; }
  function list() {
    if (tab === 'd') { var k = iso(curDay()); if (!S.d[k]) S.d[k] = []; return S.d[k]; }
    if (tab === 'm') { var k2 = my + '-' + mm; if (!S.m[k2]) S.m[k2] = []; return S.m[k2]; }
    return S.l;
  }
  function itemHTML(g, i) {
    return '<div class="it ' + (g.done ? 'done' : '') + '">' +
      '<span class="n">' + FA(i) + '</span>' +
      '<button type="button" class="ck" data-a="t" data-id="' + g.id + '">✓</button>' +
      '<span class="tx">' + esc(g.t) + '</span>' +
      '<button type="button" class="ic" data-a="e" data-id="' + g.id + '">✏️</button>' +
      '<button type="button" class="ic" data-a="x" data-id="' + g.id + '">🗑️</button></div>';
  }
  function render() {
    try {
      var nav = $('#nav');
      if (!nav) return;
      nav.innerHTML = TABS.map(function (t) {
        return '<button type="button" class="' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '"><span>' + t[1] + '</span>' + t[2] + '</button>';
      }).join('');
      var L = list();
      var dn = L.filter(function (g) { return g.done; }).length;
      var pc = L.length ? Math.round(dn / L.length * 100) : 0;
      var h = '';
      if (tab === 'd') {
        var dd = curDay();
        h += '<div class="card"><div class="dn">' +
          '<button type="button" class="btn ghost" data-a="nx">›</button>' +
          '<div>' + wd(dd) + '<br><span class="st">' + jstr(dd) + (off === 0 ? ' · امروز' : '') + '</span></div>' +
          '<button type="button" class="btn ghost" data-a="pv">‹</button></div>' +
          '<div class="grid2" style="margin-top:12px">' +
          '<button type="button" class="btn ghost" data-a="td">📍 امروز</button>' +
          '<button type="button" class="btn ghost" data-a="ms">⏰ بازه‌ها</button></div></div>';
      }
      if (tab === 'm') {
        var ys = [], seen = {};
        [now0.y, my].concat(S.y || []).forEach(function (y) { if (!seen[y]) { seen[y] = 1; ys.push(y); } });
        ys.sort(function (a, b) { return a - b; });
        h += '<div class="card grid2"><select id="sy">' + ys.map(function (y) {
          return '<option value="' + y + '" ' + (y === my ? 'selected' : '') + '>' + FA(y) + '</option>';
        }).join('') + '<option value="new">＋ افزودن سال جدید</option></select><select id="sm">' +
          MN.map(function (n, i) {
            return '<option value="' + (i + 1) + '" ' + (i + 1 === mm ? 'selected' : '') + '>' + n + '</option>';
          }).join('') + '</select></div>';
      }
      var sel = '';
      if (tab === 'd') {
        sel = '<select id="ns"><option value="">بدون بازه</option>' +
          (S.sec || []).map(function (s) {
            return '<option value="' + s.id + '" ' + (s.id === S.ds ? 'selected' : '') + '>' + esc(s.n || 'بدون نام') + '</option>';
          }).join('') + '</select>';
      }
      h += '<div class="card"><div class="add ' + (tab === 'd' ? '' : 'one') + '">' +
        '<input id="ni" placeholder="هدف جدید را بنویسید…">' + sel +
        '<button type="button" class="btn" data-a="add">＋ افزودن</button></div>' +
        '<div class="pg"><i style="width:' + pc + '%"></i></div>' +
        '<div class="st">' + FA(dn) + ' از ' + FA(L.length) + ' انجام شد · ' + FA(pc) + '٪</div>';
      if (!L.length) {
        h += '<div class="empty">هنوز هدفی ثبت نشده ✨</div>';
      } else if (tab === 'd') {
        var groups = (S.sec || []).map(function (s) {
          return { s: s, l: L.filter(function (g) { return g.sec === s.id; }) };
        });
        groups.push({
          s: { n: 'بدون بازه' },
          l: L.filter(function (g) {
            return !g.sec || !(S.sec || []).some(function (s) { return s.id === g.sec; });
          })
        });
        groups.forEach(function (x) {
          if (x.l.length) {
            h += '<div class="sec"><div class="sh"><span>' + esc(x.s.n || 'بدون نام') + '</span>' +
              (x.s.f ? '<small>' + FA(x.s.f) + ' – ' + FA(x.s.t) + '</small>' : '') +
              '</div>' + x.l.map(function (g, i) { return itemHTML(g, i + 1); }).join('') + '</div>';
          }
        });
      } else {
        h += '<div class="sec">' + L.map(function (g, i) { return itemHTML(g, i + 1); }).join('') + '</div>';
      }
      h += '</div><div class="card grid2">' +
        '<button type="button" class="btn alt" data-a="xi">🖼️ خروجی تصویری</button>' +
        '<button type="button" class="btn" data-a="xt">📝 خروجی متنی</button></div>';
      var main = $('#main');
      if (main) main.innerHTML = h;
    } catch (e) { console.error('render error', e); }
  }
  function modal(title, body, ok, cb, extra) {
    extra = extra || '';
    var m = $('#mo');
    if (!m) return;
    m.innerHTML = '<div class="mo"><div class="md"><h3>' + title + '</h3>' + body +
      '<div class="mb">' + (ok ? '<button type="button" class="btn" id="mok">' + ok + '</button>' : '') +
      extra + '<button type="button" class="btn ghost" id="mx">بستن</button></div></div></div>';
    var mx = $('#mx');
    if (mx) mx.onclick = function () { m.innerHTML = ''; };
    if (ok) {
      var mok = $('#mok');
      if (mok) mok.onclick = function () { if (cb && cb() === false) return; m.innerHTML = ''; };
    }
  }
  function title() {
    if (tab === 'd') return 'اهداف روزانه — ' + wd(curDay()) + ' ' + jstr(curDay());
    if (tab === 'm') return 'اهداف ماهانه — ' + MN[mm - 1] + ' ' + FA(my);
    return 'اهداف بلندمدت';
  }
  function lines() {
    var L = list(), r = [{ h: title() }];
    if (tab === 'd') {
      var groups = (S.sec || []).map(function (s) {
        return { n: (s.n || 'بدون نام') + ' (' + FA(s.f) + ' – ' + FA(s.t) + ')', l: L.filter(function (g) { return g.sec === s.id; }) };
      });
      groups.push({
        n: 'بدون بازه',
        l: L.filter(function (g) { return !g.sec || !(S.sec || []).some(function (s) { return s.id === g.sec; }); })
      });
      groups.forEach(function (x) {
        if (x.l.length) {
          r.push({ s: '▪ ' + x.n });
          x.l.forEach(function (g, i) { r.push({ t: g.t, n: FA(i + 1), d: g.done }); });
        }
      });
    } else {
      L.forEach(function (g, i) { r.push({ t: g.t, n: FA(i + 1), d: g.done }); });
    }
    var u = L.filter(function (g) { return !g.done; });
    if (u.length) {
      r.push({ s: '⏳ اهداف انجام‌نشده', u0: 1 });
      u.forEach(function (g, i) { r.push({ t: g.t, n: FA(i + 1) }); });
    }
    return r;
  }
  function textOut() {
    return lines().map(function (x) {
      if (x.h) return x.h;
      if (x.s) return '\n' + x.s;
      if (x.d) return x.n + '. ✅ ' + x.t;
      return x.n + '. ' + x.t;
    }).join('\n');
  }
  function imgOut() {
    var r = lines(), W = 900, F = "'Vazirmatn',Tahoma,sans-serif";
    var c = document.createElement('canvas');
    var x = c.getContext('2d');
    var mw = W - 120, rows = [], T = '';
    x.direction = 'rtl';
    function wrap(t, f) {
      x.font = f; var o = [], cur = '';
      String(t).split(' ').forEach(function (w) {
        var n = cur ? cur + ' ' + w : w;
        if (x.measureText(n).width > mw && cur) { o.push(cur); cur = w; } else cur = n;
      });
      if (cur) o.push(cur); return o;
    }
    r.forEach(function (l) {
      if (l.h) { T = l.h; return; }
      if (l.s) { rows.push({ t: l.s, f: '700 28px ' + F, c: l.u0 ? '#dc2626' : '#7c3aed', g: l.u0 ? 34 : 14 }); return; }
      var label = l.d ? (l.n + '. ✅ ' + l.t) : (l.n + '. ' + l.t);
      wrap(label, '400 26px ' + F).forEach(function (s) {
        rows.push({ t: s, f: '400 26px ' + F, c: l.d ? '#9ca3af' : '#1e1b4b', d: l.d, g: 0 });
      });
    });
    var H = 170 + rows.reduce(function (a, z) { return a + 46 + z.g; }, 0) + 30;
    c.width = W; c.height = H;
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    var g = x.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, '#0d9488'); g.addColorStop(1, '#7c3aed');
    x.fillStyle = g; x.fillRect(0, 0, W, 110);
    x.direction = 'rtl'; x.textAlign = 'right'; x.fillStyle = '#fff';
    x.font = '700 30px ' + F; x.fillText('🎯 ' + T, W - 40, 68);
    var y = 170;
    rows.forEach(function (z) {
      y += z.g; x.font = z.f; x.fillStyle = z.c; x.fillText(z.t, W - 50, y);
      if (z.d) { var w = x.measureText(z.t).width; x.fillRect(W - 50 - w, y - 9, w, 2.5); }
      y += 46;
    });
    return c.toDataURL('image/jpeg', 0.82);
  }
  function exportImg() {
    var go = function () {
      lastImg = imgOut();
      modal('خروجی تصویری', '<img src="' + lastImg + '" alt="">', '', null,
        '<a class="btn" href="' + lastImg + '" download="hadaf.jpg">⬇️ دانلود</a>' +
        (navigator.canShare ? '<button type="button" class="btn alt" data-a="sh">📤 اشتراک</button>' : ''));
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go).catch(go);
    else go();
  }
  function syncSec() {
    document.querySelectorAll('#mo [data-s]').forEach(function (r) {
      var s = (S.sec || []).find(function (z) { return z.id === r.dataset.s; });
      if (!s) return;
      var sn = r.querySelector('.sn'), tf = r.querySelector('.tf'), tt = r.querySelector('.tt');
      if (sn) s.n = (sn.value || '').trim();
      if (tf && tf.value) s.f = tf.value;
      if (tt && tt.value) s.t = tt.value;
    });
  }
  function secModal() {
    var body = (S.sec || []).map(function (s) {
      return '<div class="sr" data-s="' + s.id + '">' +
        '<div class="r1"><input class="sn" value="' + esc(s.n || '') + '" placeholder="نام بازه (اختیاری)">' +
        '<button type="button" class="ic" data-a="ds" data-id="' + s.id + '">🗑️</button></div>' +
        '<div class="r2"><span>از</span><input type="time" class="tf" value="' + (s.f || '') + '">' +
        '<span>تا</span><input type="time" class="tt" value="' + (s.t || '') + '"></div></div>';
    }).join('') + '<button type="button" class="addb" data-a="as">＋ افزودن بازه</button>';
    modal('بازه‌های روز', body, 'ذخیره', function () {
      syncSec();
      S.sec.sort(function (a, b) { return String(a.f || '').localeCompare(String(b.f || '')); });
      save(); render();
    });
  }
  function addYear() {
    modal('افزودن سال جدید',
      '<label>سال شمسی را وارد کنید</label><input id="yy" inputmode="numeric" placeholder="۱۴۰۷" style="text-align:center">',
      'تأیید',
      function () {
        var el = $('#yy'); if (!el) return false;
        var y = parseInt(String(el.value).replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }), 10);
        if (!(y >= 1300 && y <= 1600)) { el.style.borderColor = 'var(--dg)'; return false; }
        if (S.y.indexOf(y) === -1) S.y.push(y);
        my = y; save(); render();
      });
  }
  document.addEventListener('click', function (e) {
    var tb = e.target.closest('[data-tab]');
    if (tb) { tab = tb.dataset.tab; render(); return; }
    var b = e.target.closest('[data-a]');
    if (!b) return;
    var a = b.dataset.a, id = b.dataset.id, L = list();
    var g = id ? L.find(function (z) { return z.id === id; }) : null;
    if (a === 'add') {
      var ni = $('#ni'); var v = ni ? ni.value.trim() : ''; if (!v) return;
      var ns = $('#ns');
      L.push({ id: uid(), t: v, done: false, sec: tab === 'd' && ns ? ns.value : '' });
      save(); render();
    } else if (a === 't' && g) { g.done = !g.done; save(); render(); }
    else if (a === 'x' && g) { L.splice(L.indexOf(g), 1); save(); render(); }
    else if (a === 'e' && g) {
      var body = '<input id="et" value="' + esc(g.t) + '">';
      if (tab === 'd') {
        body += '<label>بازه</label><select id="es"><option value="">بدون بازه</option>' +
          (S.sec || []).map(function (s) {
            return '<option value="' + s.id + '" ' + (s.id === g.sec ? 'selected' : '') + '>' + esc(s.n || 'بدون نام') + '</option>';
          }).join('') + '</select>';
      }
      modal('ویرایش هدف', body, 'ذخیره', function () {
        var et = $('#et'); var vv = et ? et.value.trim() : ''; if (!vv) return false;
        g.t = vv;
        if (tab === 'd') { var es = $('#es'); if (es) g.sec = es.value; }
        save(); render();
      });
    } else if (a === 'pv') { off--; render(); }
    else if (a === 'nx') { off++; render(); }
    else if (a === 'td') { off = 0; render(); }
    else if (a === 'xt') {
      modal('خروجی متنی', '<textarea id="tt" readonly></textarea>', '📋 کپی', function () {
        var t = $('#tt'); if (!t) return false;
        t.select(); var ok = false;
        try { ok = document.execCommand('copy'); } catch (err) {}
        if (!ok && navigator.clipboard) { try { navigator.clipboard.writeText(t.value); } catch (err) {} }
        var mok = $('#mok'); if (mok) mok.textContent = '✅ کپی شد'; return false;
      });
      var tt = $('#tt'); if (tt) tt.value = textOut();
    } else if (a === 'xi') { exportImg(); }
    else if (a === 'sh') {
      fetch(lastImg).then(function (res) { return res.blob(); }).then(function (bl) {
        var f = new File([bl], 'hadaf.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f] }).catch(function () {});
      }).catch(function () {});
    } else if (a === 'ms') { secModal(); }
    else if (a === 'as') {
      syncSec(); S.sec.push({ id: uid(), n: '', f: '', t: '' }); save(); secModal();
    } else if (a === 'ds') {
      syncSec(); S.sec = S.sec.filter(function (s) { return s.id !== id; }); save(); secModal();
    }
  });
  document.addEventListener('change', function (e) {
    var i = e.target.id;
    if (i === 'ns') { S.ds = e.target.value; save(); }
    if (i === 'sy') { if (e.target.value === 'new') { render(); addYear(); } else { my = +e.target.value; render(); } }
    if (i === 'sm') { mm = +e.target.value; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'ni') {
      var btn = document.querySelector('[data-a="add"]'); if (btn) btn.click();
    }
  });
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
